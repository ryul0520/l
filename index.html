<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY 커스텀 런치패드 PRO (자동저장 & 미리듣기 완벽판)</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #0a0a0f;
      --panel-bg: rgba(20, 20, 30, 0.8);
      --empty-color: #333344;
      --recorded-color-1: #00f2fe;
      --recorded-color-2: #4facfe;
      --tts-color-1: #a29bfe;
      --tts-color-2: #6c5ce7;
    }
    
    * { box-sizing: border-box; }
    
    body {
      background-color: var(--bg-color);
      margin: 0; padding: 0;
      display: flex; flex-direction: column;
      height: 100vh; width: 100vw;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      color: white; user-select: none; overflow: hidden;
      touch-action: manipulation;
    }

    header {
      flex: 0 0 auto; padding: 10px 15px; display: flex; flex-direction: column; align-items: center;
      background: var(--panel-bg); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      border-bottom: 2px solid rgba(255,255,255,0.1); z-index: 10;
    }

    h1 { margin: 0 0 10px 0; font-size: 20px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
    
    .mode-switch {
      display: flex; background: #222; border-radius: 30px; padding: 5px; margin-bottom: 10px; gap: 5px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8); flex-wrap: wrap; justify-content: center;
    }
    .mode-btn {
      background: transparent; color: #aaa; border: none; padding: 8px 12px; border-radius: 25px;
      font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.3s;
    }
    .mode-btn.active { color: black; }
    .mode-btn[data-mode="play"].active { background: #00f2fe; box-shadow: 0 0 15px #00f2fe; }
    .mode-btn[data-mode="move"].active { background: #ffcc00; box-shadow: 0 0 15px #ffcc00; }
    .mode-btn[data-mode="rename"].active { background: #00ff99; box-shadow: 0 0 15px #00ff99; }
    .mode-btn[data-mode="record"].active { background: #ff3366; box-shadow: 0 0 15px #ff3366; color: white;}
    .mode-btn[data-mode="tts"].active { background: #a29bfe; box-shadow: 0 0 15px #a29bfe; color: black;}
    .mode-btn[data-mode="settings"].active { background: #ff9900; box-shadow: 0 0 15px #ff9900; color: black;}

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .control-group { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.5); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); font-size: 13px; }
    button.metro-btn { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    button.metro-btn.active { background: #00f2fe; color: black; }
    input[type=range] { cursor: pointer; width: 80px; }

    .launchpad-container { flex: 1 1 auto; padding: 15px; display: flex; align-items: center; justify-content: center; }
    .launchpad { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; width: 100%; height: 100%; max-width: 1200px; max-height: 800px; }

    .pad {
      border: none; border-radius: 15px; font-size: clamp(12px, 2vw, 20px); font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line; word-break: break-word;
      padding: 10px; color: rgba(255,255,255,0.5); transition: transform 0.05s, box-shadow 0.05s; position: relative;
      background: var(--empty-color); box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 0px #1a1a24;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    
    .pad.has-audio { color: white; background: linear-gradient(135deg, var(--recorded-color-1), var(--recorded-color-2)); box-shadow: 0 8px 0px #1a5b99, inset 0 0 20px rgba(255,255,255,0.2); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .pad.has-tts { color: white; background: linear-gradient(135deg, var(--tts-color-1), var(--tts-color-2)); box-shadow: 0 8px 0px #4a3b99, inset 0 0 20px rgba(255,255,255,0.2); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .pad.active { transform: scale(0.92) translateY(5px) !important; filter: brightness(1.4); }
    
    body.mode-move .pad { cursor: grab; animation: jiggle 0.3s infinite alternate; }
    body.mode-rename .pad { cursor: text; border: 2px dashed #00ff99; }
    body.mode-tts .pad { cursor: text; border: 2px dashed #a29bfe; }
    body.mode-settings .pad { cursor: pointer; border: 2px dashed #ff9900; }
    
    @keyframes jiggle { 0% { transform: rotate(-1deg) scale(0.98); } 100% { transform: rotate(1deg) scale(1.02); } }
    
    /* 🎛️ 개별 설정 모달 */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #1a1a24; padding: 25px; border-radius: 20px; border: 2px solid #ff9900;
      display: flex; flex-direction: column; gap: 12px; min-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .modal-content h3 { margin: 0 0 5px 0; color: #ffcc00; text-align: center; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 10px;}
    .setting-row input[type=range] { flex-grow: 1; margin: 0 15px; }
    .setting-row span.val { width: 40px; text-align: right; font-weight: bold; color: #00f2fe; }
    
    .preview-btn { background: #00f2fe; border: none; color: black; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; margin-top: 10px; }
    .preview-btn:active { transform: scale(0.95); }
    .close-btn { background: #ff9900; border: none; color: black; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
    .close-btn:active { transform: scale(0.95); }

    .pad.countdown { background: #ffcc00 !important; color: black !important; font-size: 40px !important; box-shadow: 0 0 30px #ffcc00 !important; transform: scale(1.05); }
    .pad.waiting { background: #ff9900 !important; color: white !important; animation: pulseWait 1.5s infinite !important; transform: scale(0.95); }
    .pad.recording { background: #ff3366 !important; color: white !important; animation: pulseRecord 1s infinite !important; transform: scale(0.95); }
    
    @keyframes pulseWait { 0% { box-shadow: 0 0 0 0 rgba(255, 153, 0, 0.8); } 70% { box-shadow: 0 0 0 15px rgba(255, 153, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 153, 0, 0); } }
    @keyframes pulseRecord { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.8); } 70% { box-shadow: 0 0 0 20px rgba(255, 51, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); } }
  </style>
</head>
<body>

  <header>
    <h1>🎛️ MY 커스텀 런치패드 PRO</h1>
    
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="play">🎵 연주</button>
      <button class="mode-btn" data-mode="move">🔄 자리 변경</button>
      <button class="mode-btn" data-mode="rename">✏️ 이름 변경</button>
      <button class="mode-btn" data-mode="record">🎙️ 자동 녹음</button>
      <button class="mode-btn" data-mode="tts">💬 TTS 입력</button>
      <button class="mode-btn" data-mode="settings">🎛️ 이펙트/속도 설정</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <button id="metroBtn" class="metro-btn">메트로놈 OFF</button>
        <label>BPM: <input type="range" id="bpmSlider" min="60" max="200" value="120"> <span id="bpmVal">120</span></label>
      </div>
    </div>
  </header>
  
  <div class="launchpad-container">
    <div class="launchpad" id="launchpad"></div>
  </div>

  <!-- 설정 모달창 (슬라이더로 모두 변경) -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3><span id="modalPadName">PAD</span> 상세 설정</h3>
      
      <div class="setting-row">
        <label>🔊 볼륨</label>
        <input type="range" id="padVolume" min="0" max="2.0" step="0.1" value="1.0">
        <span id="padVolumeVal" class="val">1.0</span>
      </div>
      
      <div class="setting-row">
        <label>⏩ 재생속도</label>
        <input type="range" id="padSpeed" min="0.5" max="3.0" step="0.1" value="1.0">
        <span id="padSpeedVal" class="val">1.0</span>
      </div>

      <div class="setting-row">
        <label>📢 에코 양</label>
        <input type="range" id="padEcho" min="0" max="1.0" step="0.1" value="0.0">
        <span id="padEchoVal" class="val">0.0</span>
      </div>

      <div class="setting-row">
        <label>🌌 리버브 양</label>
        <input type="range" id="padReverb" min="0" max="1.0" step="0.1" value="0.0">
        <span id="padReverbVal" class="val">0.0</span>
      </div>
      
      <button id="previewBtn" class="preview-btn">▶️ 변경된 소리 들어보기</button>
      <button id="closeModal" class="close-btn">닫기</button>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    let currentMode = 'play'; 
    let mediaRecorder, audioChunks = [], isRecording = false, isCountingDown = false, isWaitingForSound = false; 
    let analyserLoopId, recordingBtn = null;

    // 데이터 모델 (echo, reverb를 float 수치 값으로 변경, pitch -> speed)
    const padsData = Array.from({ length: 15 }, (_, i) => ({
      id: `pad_${i+1}`, text: `PAD ${i+1}`, customAudioBuffer: null, audioArrayBuffer: null, type: null, fallbackTTS: null,
      volume: 1.0, speed: 1.0, reverb: 0.0, echo: 0.0
    }));

    const launchpad = document.getElementById('launchpad');

    padsData.forEach((data) => {
      const btn = document.createElement('button');
      btn.className = 'pad';
      btn.innerText = data.text;
      btn.dataset.id = data.id;
      
      btn.addEventListener('pointerdown', (e) => {
        if (currentMode !== 'move') e.preventDefault(); 
        const targetData = padsData.find(p => p.id === btn.dataset.id);
        handlePadClick(targetData, btn, e);
      });
      launchpad.appendChild(btn);
    });

    const sortable = new Sortable(launchpad, { 
      animation: 150, disabled: true, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
      onEnd: () => {
        const order = Array.from(launchpad.children).map(btn => btn.dataset.id);
        localStorage.setItem("padOrder", JSON.stringify(order));
      }
    });

    let db;
    const request = indexedDB.open("LaunchpadProDB2", 1); // 스키마 변경을 위해 버전 또는 이름 변경
    request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("pads", { keyPath: "id" }); };
    request.onsuccess = (e) => { db = e.target.result; loadFromDB(); };

    function savePadToDB(data) {
      if (!db) return;
      const tx = db.transaction("pads", "readwrite");
      tx.objectStore("pads").put({
        id: data.id, text: data.text, volume: data.volume, speed: data.speed, 
        reverb: data.reverb, echo: data.echo, 
        audioArrayBuffer: data.audioArrayBuffer, fallbackTTS: data.fallbackTTS, type: data.type
      });
    }

    async function loadFromDB() {
      if (!db) return;
      const savedOrder = JSON.parse(localStorage.getItem("padOrder"));
      if (savedOrder) savedOrder.forEach(id => { const btn = document.querySelector(`.pad[data-id="${id}"]`); if (btn) launchpad.appendChild(btn); });

      const req = db.transaction("pads", "readonly").objectStore("pads").getAll();
      req.onsuccess = async (e) => {
        initAudio();
        for (let item of e.target.result) {
          const data = padsData.find(p => p.id === item.id);
          if (!data) continue;
          
          Object.assign(data, item); 
          // 구버전 호환성 패치 (true/false를 0.5/0.0 수치로 변환)
          if(typeof data.echo === "boolean") data.echo = data.echo ? 0.5 : 0.0;
          if(typeof data.reverb === "boolean") data.reverb = data.reverb ? 0.5 : 0.0;
          if(item.pitch !== undefined) data.speed = item.pitch;

          const btn = document.querySelector(`.pad[data-id="${data.id}"]`);
          btn.innerText = data.text;
          
          if (data.audioArrayBuffer) {
            try {
              data.customAudioBuffer = trimSilence(await audioCtx.decodeAudioData(data.audioArrayBuffer.slice(0)));
              btn.classList.add(data.type === 'tts' ? 'has-tts' : 'has-audio');
            } catch(err) { console.error("로딩 에러", err); }
          } else if (data.fallbackTTS) {
            btn.classList.add('has-tts');
          }
        }
      };
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isCountingDown) return; 
        if (isRecording || isWaitingForSound) stopRecording(padsData.find(d => d.id === recordingBtn.dataset.id), recordingBtn);

        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode; document.body.className = `mode-${currentMode}`;
        sortable.option('disabled', currentMode !== 'move');
      });
    });

    let currentEditingPad = null, currentEditingBtn = null;
    const modal = document.getElementById('settingsModal');
    
    function openSettings(data, btn) {
      currentEditingPad = data; currentEditingBtn = btn;
      document.getElementById('modalPadName').innerText = data.text;
      
      document.getElementById('padVolume').value = data.volume; document.getElementById('padVolumeVal').innerText = data.volume.toFixed(1);
      document.getElementById('padSpeed').value = data.speed; document.getElementById('padSpeedVal').innerText = data.speed.toFixed(1) + 'x';
      document.getElementById('padEcho').value = data.echo; document.getElementById('padEchoVal').innerText = data.echo.toFixed(1);
      document.getElementById('padReverb').value = data.reverb; document.getElementById('padReverbVal').innerText = data.reverb.toFixed(1);
      
      modal.classList.add('show');
    }

    function playPreview() {
      if(currentEditingPad && currentEditingBtn) {
        playSound(currentEditingPad, currentEditingBtn);
        savePadToDB(currentEditingPad);
      }
    }

    // 슬라이더 조작 시 실시간 텍스트 반영
    document.getElementById('padVolume').addEventListener('input', (e) => { currentEditingPad.volume = parseFloat(e.target.value); document.getElementById('padVolumeVal').innerText = currentEditingPad.volume.toFixed(1); });
    document.getElementById('padSpeed').addEventListener('input', (e) => { currentEditingPad.speed = parseFloat(e.target.value); document.getElementById('padSpeedVal').innerText = currentEditingPad.speed.toFixed(1) + 'x'; });
    document.getElementById('padEcho').addEventListener('input', (e) => { currentEditingPad.echo = parseFloat(e.target.value); document.getElementById('padEchoVal').innerText = currentEditingPad.echo.toFixed(1); });
    document.getElementById('padReverb').addEventListener('input', (e) => { currentEditingPad.reverb = parseFloat(e.target.value); document.getElementById('padReverbVal').innerText = currentEditingPad.reverb.toFixed(1); });
    
    // 드래그를 놓았을 때(change) 소리 재생
    ['padVolume', 'padSpeed', 'padEcho', 'padReverb'].forEach(id => document.getElementById(id).addEventListener('change', playPreview));
    
    document.getElementById('previewBtn').addEventListener('click', playPreview);
    document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('show'));

    async function handlePadClick(data, btn, e) {
      if (currentMode === 'move') return; 

      if (currentMode === 'rename') {
        setTimeout(() => {
          const newName = prompt("새로운 이름을 입력하세요:", data.text);
          if (newName !== null && newName.trim() !== "") { 
            data.text = newName; btn.innerText = newName; savePadToDB(data);
          }
        }, 10);
        return;
      }
      if (currentMode === 'settings') { openSettings(data, btn); return; }
      if (currentMode === 'tts') {
        setTimeout(() => {
          const defaultTxt = data.text.startsWith('PAD ') ? "" : data.text;
          const text = prompt("재생할 단어나 문장을 입력하세요 (다중 재생 지원):", defaultTxt);
          if (text !== null && text.trim() !== "") generateTTS(data, btn, text.trim());
        }, 10);
        return;
      }
      if (currentMode === 'record') {
        if (isCountingDown) return; 
        if (isRecording || isWaitingForSound) {
          if (recordingBtn === btn) stopRecording(data, btn); 
          else alert("현재 다른 패드를 녹음 대기/진행 중입니다!");
        } else {
          startCountdownAndRecord(data, btn);
        }
        return;
      }
      if (currentMode === 'play') { playSound(data, btn); }
    }

    function trimSilence(buffer) {
      const threshold = 0.02, channels = buffer.numberOfChannels, length = buffer.length;
      let start = length, end = 0;
      for (let i = 0; i < channels; i++) {
        const data = buffer.getChannelData(i);
        let j = 0; while (j < length && Math.abs(data[j]) < threshold) j++;
        if (j < start) start = j;
        let k = length - 1; while (k >= 0 && Math.abs(data[k]) < threshold) k--;
        if (k > end) end = k;
      }
      if (start >= end) return buffer; 
      
      const margin = Math.floor(buffer.sampleRate * 0.01);
      start = Math.max(0, start - margin); end = Math.min(length, end + margin);
      const trimmedBuffer = audioCtx.createBuffer(channels, end - start, buffer.sampleRate);
      for (let i = 0; i < channels; i++) trimmedBuffer.copyToChannel(buffer.getChannelData(i).subarray(start, end), i);
      return trimmedBuffer;
    }

    // 💡 TTS 다중 동시 재생을 위한 개선된 다운로드 방식
    async function generateTTS(data, btn, text) {
      initAudio(); btn.classList.remove('has-audio', 'has-tts'); btn.classList.add('waiting'); btn.innerHTML = "⏳<br>생성 중...";
      try {
        // 더 안정적인 구글 TTS API 엔드포인트 적용 (client=gtx)
        const ttsUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ko&q=${encodeURIComponent(text)}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ttsUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("네트워크 오류");
        
        const arrayBuffer = await response.arrayBuffer();
        data.audioArrayBuffer = arrayBuffer; data.type = 'tts'; data.fallbackTTS = null; 
        data.customAudioBuffer = trimSilence(await audioCtx.decodeAudioData(arrayBuffer.slice(0)));
      } catch (err) {
        // 통신 실패시에만 내장 TTS (이 경우에만 동시 재생 불가)
        console.warn("TTS Fetch 실패, 내장 TTS로 폴백합니다.");
        data.customAudioBuffer = null; data.audioArrayBuffer = null; data.fallbackTTS = text; data.type = 'tts';
      }
      data.text = text; btn.classList.remove('waiting'); btn.classList.add('has-tts'); btn.innerText = text;
      savePadToDB(data);
    }

    async function startCountdownAndRecord(data, btn) {
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (err) { alert("마이크 권한 필요!"); return; }

      initAudio(); isCountingDown = true;
      for (let i = 3; i > 0; i--) { btn.classList.add('countdown'); btn.innerText = i; await new Promise(r => setTimeout(r, 1000)); }

      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; source.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      btn.classList.remove('countdown'); btn.classList.add('waiting'); btn.innerHTML = "🎤<br>큰 소리 대기중...";
      mediaRecorder = new MediaRecorder(stream); audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

      isCountingDown = false; isWaitingForSound = true; recordingBtn = btn;
      
      function checkSoundLevel() {
        if (!isWaitingForSound) return;
        analyser.getByteFrequencyData(dataArray);
        if (Math.max(...dataArray) > 35) { 
          isWaitingForSound = false; mediaRecorder.start(); isRecording = true;
          btn.classList.remove('waiting'); btn.classList.add('recording'); btn.innerHTML = "🔴<br>녹음 중...";
        } else { analyserLoopId = requestAnimationFrame(checkSoundLevel); }
      }
      checkSoundLevel();
    }

    async function stopRecording(data, btn) {
      if (isWaitingForSound) {
        isWaitingForSound = false; cancelAnimationFrame(analyserLoopId);
        mediaRecorder.stream.getTracks().forEach(t => t.stop()); btn.classList.remove('waiting'); btn.innerText = data.text; recordingBtn = null; return;
      }
      mediaRecorder.onstop = async () => {
        initAudio();
        const arrayBuffer = await (new Blob(audioChunks)).arrayBuffer();
        data.audioArrayBuffer = arrayBuffer; data.type = 'audio'; data.fallbackTTS = null;
        data.customAudioBuffer = trimSilence(await audioCtx.decodeAudioData(arrayBuffer.slice(0)));
        
        btn.classList.remove('recording', 'has-tts'); btn.classList.add('has-audio'); btn.innerText = data.text; 
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        savePadToDB(data);
      };
      mediaRecorder.stop(); isRecording = false; recordingBtn = null;
    }

    // 💡 이펙트 병렬 믹싱 (수치에 따른 조절) 적용
    function playSound(data, btn) {
      initAudio();
      btn.classList.add('active'); setTimeout(() => btn.classList.remove('active'), 100);

      if (data.customAudioBuffer) {
        const source = audioCtx.createBufferSource();
        source.buffer = data.customAudioBuffer;
        source.playbackRate.value = data.speed; // 재생 속도 조절
        
        // 최종 사운드가 모이는 마스터 노드
        const masterMix = audioCtx.createGain(); 
        masterMix.gain.value = 1.0;

        // 원본 사운드 (Dry) 연결
        const dryGain = audioCtx.createGain();
        dryGain.gain.value = 1.0; 
        source.connect(dryGain);
        dryGain.connect(masterMix);

        // 에코 (Delay) 적용
        if (data.echo > 0) {
          const delay = audioCtx.createDelay(); delay.delayTime.value = 0.3; 
          const feedback = audioCtx.createGain(); feedback.gain.value = 0.4; 
          
          const echoWet = audioCtx.createGain(); 
          echoWet.gain.value = data.echo; // 슬라이더 수치만큼 에코 볼륨 반영

          source.connect(delay); 
          delay.connect(feedback); 
          feedback.connect(delay); 
          
          delay.connect(echoWet);
          echoWet.connect(masterMix);
        }

        // 리버브 적용
        if (data.reverb > 0) {
          const reverb = audioCtx.createConvolver();
          if (!window.reverbBuffer) window.reverbBuffer = createReverbBuffer(audioCtx);
          reverb.buffer = window.reverbBuffer;
          
          const reverbWet = audioCtx.createGain(); 
          reverbWet.gain.value = data.reverb * 1.5; // 리버브 효과를 조금 더 증폭해서 믹스

          source.connect(reverb); 
          reverb.connect(reverbWet); 
          reverbWet.connect(masterMix);
        }

        // 최종 볼륨 적용
        const volumeNode = audioCtx.createGain();
        volumeNode.gain.value = data.volume; 
        
        masterMix.connect(volumeNode);
        volumeNode.connect(audioCtx.destination);
        
        source.start(0);

      } else if (data.fallbackTTS) {
        // 폴백 TTS (동시 재생 불가)
        const utterance = new SpeechSynthesisUtterance(data.fallbackTTS);
        utterance.lang = 'ko-KR'; utterance.rate = data.speed; utterance.volume = data.volume;
        window.speechSynthesis.speak(utterance);
      }
    }

    function createReverbBuffer(ctx) {
      let length = ctx.sampleRate * 2.0, impulse = ctx.createBuffer(2, length, ctx.sampleRate);
      for (let i = 0; i < 2; i++) {
        let channelData = impulse.getChannelData(i);
        for (let j = 0; j < length; j++) { channelData[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3); }
      } return impulse;
    }
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

    let metroBPM = 120, isMetroPlaying = false, nextNoteTime = 0.0, metroTimerID;
    document.getElementById('bpmSlider').addEventListener('input', (e) => { metroBPM = e.target.value; document.getElementById('bpmVal').innerText = metroBPM; });
    document.getElementById('metroBtn').addEventListener('click', function() {
      initAudio(); isMetroPlaying = !isMetroPlaying;
      if (isMetroPlaying) { this.innerText = "메트로놈 ON"; this.classList.add('active'); nextNoteTime = audioCtx.currentTime + 0.05; scheduler(); } 
      else { this.innerText = "메트로놈 OFF"; this.classList.remove('active'); clearTimeout(metroTimerID); }
    });
    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.value = 1000; gain.gain.setValueAtTime(0.5, nextNoteTime); gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(nextNoteTime); osc.stop(nextNoteTime + 0.1); nextNoteTime += 60.0 / metroBPM;
      } metroTimerID = setTimeout(scheduler, 25);
    }
  </script>
</body>
</html>
